name: Scheduled Maintenance (Katalog Bakımı — ISRC/Kapak/Sanatçı Görseli)

# 01-yillik-kontrolsuz-calisma-plani.md devamı (2026-09-16).
#
# account_purge/mood_pkg/playlist_refresh TypeScript'e (Vercel) taşındı —
# yalnızca katalog bakımı (Deezer/Last.fm/MusicBrainz çok sağlayıcılı,
# olgun Python kodu) burada, GitHub Actions'ta kaldı. Düşük öncelikli/
# kozmetik olduğu için otomatik zamanlaması korunuyor.
#
# GitHub'ın kendi `schedule:` tetikleyicisi KASITLI olarak kullanılmıyor: 60
# gün boyunca repoda commit/push olmazsa GitHub zamanlanmış workflow'ları
# otomatik durdurur. Bunun yerine asıl zamanlayıcı Supabase pg_cron'dur —
# `/api/cron/trigger-worker-maintenance` route'u `repository_dispatch` ile
# bu workflow'u uyandırır.
on:
  repository_dispatch:
    types: [scheduled_maintenance]
  workflow_dispatch:

jobs:
  catalog-maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Python 3.13 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Katalog Bakım Turu
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          echo "1. ISRC backfill"
          python -m app.cron.isrc_backfill
          echo "2. Kapak backfill"
          python -m app.cron.cover_backfill
          echo "3. Sanatçı görsel backfill"
          python -m app.cron.artist_image_backfill
          echo "4. Katalog backfill"
          python -m app.cron.catalog_backfill
