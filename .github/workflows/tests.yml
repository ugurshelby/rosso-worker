name: Testler

# Worker'ın anayasal denetimi `pytest`. Yerel makinede Python yok; bu iş her
# push'ta hem testleri koşar hem de `pip install -e .`'in kurulabildiğini
# kanıtlar (2026-09-22: kurulum aylarca kırıktı, kimse görmedi).
on:
  push:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Kur
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest
        # Yer tutucu: testler sahte istemci kullanır, ağa çıkmaz. Bazı yollar
        # (ör. account_data_parser batch_size) get_settings() okur ve o, env
        # yoksa düşer — geliştirici makinesinde .env olduğu için hiç görülmemişti.
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test-placeholder
        run: pytest -q
