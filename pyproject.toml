[project]
name = "rosso-worker"
version = "0.1.0"
description = "Rosso ağır iş worker'ı — Spotify ZIP export işleme, track matching, (Faz 5'te) ytmusicapi"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "supabase>=2.9",
    "ijson>=3.3",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "httpx>=0.27",
    "ytmusicapi>=1.12.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
