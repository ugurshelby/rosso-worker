[project]
name = "rosso-worker"
version = "0.1.0"
description = "Rosso ağır iş worker'ı — Spotify ZIP export işleme, track matching (Spotify-only; ytmusicapi kaldırıldı, bkz. CLAUDE.md platform sınırı)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "supabase>=2.9",
    "ijson>=3.3",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "httpx>=0.27",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Paket keşfi AÇIKÇA `app` ile sınırlı. `assets/` (playlist kapakları) paket
# değil, veri klasörü — setuptools'un otomatik keşfi onu da üst düzey paket
# sanıp "Multiple top-level packages discovered in a flat-layout: ['app',
# 'assets']" ile `pip install -e .`'i düşürüyordu. ÖLÇÜLDÜ 2026-09-22:
# process-zip.yml GitHub Actions'ta HİÇ kurulamıyordu; ZIP'ler 'queued'da
# kalıyordu. assets'e kod yol ile erişir (auto_playlist_generator.py
# `_COVERS_DIR`), paket olarak kurulması gerekmez.
[tool.setuptools.packages.find]
include = ["app*"]
